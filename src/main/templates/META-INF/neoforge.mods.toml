modLoader="javafml"

loaderVersion="${loader_version_range}"

license="${mod_license}"

issueTrackerURL="https://github.com/ImEden6/Create-Odds-n-Ends/issues"

[[mods]]

modId="${mod_id}"

version="${mod_version}"

displayName="${mod_name}"

displayURL="https://github.com/ImEden6/Create-Odds-n-Ends"

logoFile="icon.png"

credits="The Create team, for Create and Ponder"

authors="Mervyn"

description='''
A Create addon with four machines. A copy lathe that turns blocks into balusters and vases. A jacquard loom that weaves tapestries from punched card chains. A barrel organ that plays book music through steam whistles. And a 3-axis CNC mill that modpacks can give their own recipes.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.10,6.1)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19,)"
    ordering="NONE"
    side="CLIENT"
